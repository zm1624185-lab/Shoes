<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Shoes Store - Local & Luxury</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-brand">
                <h2><i class="fas fa-shoe-prints"></i> ShoeHub</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#premium">Premium</a></li>
                <li><a href="#local">Local</a></li>
                <li><a href="#about">About</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Premium & Local <span class="highlight">3D Shoes</span></h1>
            <p>Experience luxury meets tradition. Rotate, zoom & try virtually!</p>
            <button class="cta-btn">Explore Collection</button>
        </div>
        <div class="hero-3d">
            <canvas id="heroCanvas"></canvas>
        </div>
    </section>

    <!-- Shoes Grid -->
    <section id="shoes-grid" class="shoes-grid">
        <div class="container">
            <h2 class="section-title">Our Collection</h2>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="premium">Premium</button>
                <button class="filter-btn" data-filter="local">Local</button>
            </div>
            <div class="shoes-container" id="shoesContainer">
                <!-- Shoes will load here -->
            </div>
        </div>
    </section>

    <!-- 3D Viewer Modal -->
    <div id="shoeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <div class="price-tag" id="modalPrice"></div>
            </div>
            <div class="modal-body">
                <canvas id="modalCanvas"></canvas>
                <div class="viewer-controls">
                    <button id="rotateLeft"><i class="fas fa-undo"></i></button>
                    <button id="rotateRight"><i class="fas fa-redo"></i></button>
                    <button id="zoomIn"><i class="fas fa-search-plus"></i></button>
                    <button id="zoomOut"><i class="fas fa-search-minus"></i></button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="add-cart">Add to Cart - <span id="modalCartPrice"></span></button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ShoeHub. Premium Quality | Local Pride</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
